<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフラインです | フォトチェンジ</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #12141c;
        color: rgba(255, 255, 255, 0.88);
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        line-height: 1.7;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.56);
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 24px;
        background-color: #e8a33d;
        background-image: linear-gradient(45deg, #a86414 25%, transparent 25%),
          linear-gradient(-45deg, #a86414 25%, transparent 25%);
        background-size: 22px 22px;
        border: 2px solid #454a5e;
        transform: rotate(-4deg);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark"></div>
      <h1>オフラインのため開けませんでした</h1>
      <p>
        一度でも開いたことがあれば、通信がなくても変換できます。<br />
        電波の届く場所で読み込み直してみてください。
      </p>
    </div>
  </body>
</html>
